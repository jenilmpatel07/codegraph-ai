services:
  db:
    image: pgvector/pgvector:pg17
    container_name: codegraph_postgres
    environment:
      POSTGRES_USER: codegraph
      POSTGRES_PASSWORD: codegraph_dev_password
      POSTGRES_DB: codegraph_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codegraph -d codegraph_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codegraph_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
